<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة باركود SKU للأوردر</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
<style>
  :root{
    --accent:#2563eb; --accent-light:#eff6ff; --accent-border:#bfdbfe;
    --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --text-primary:#111827; --text-secondary:#6b7280;
    --border:#e5e7eb; --surface:#ffffff; --bg:#f3f4f6;
    --font-body: 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif;
    --font-mono: 'Consolas', 'Courier New', monospace;
    --font-label: Georgia, 'Times New Roman', 'Noto Serif', serif; /* خط عنوان الليبل — مطابق لـ Retail Force */
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--font-body); background:var(--bg);
    color:var(--text-primary); direction:rtl;
  }
  .container{max-width:960px; margin:0 auto; padding:20px;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:16px 20px; margin-bottom:16px;
  }
  header .title{font-size:18px; font-weight:700; display:flex; align-items:center; gap:10px;}
  header .title .sub{font-size:12px; font-weight:400; color:var(--text-secondary);}
  .icon-btn{
    border:1px solid var(--border); background:var(--surface); border-radius:8px;
    padding:8px 12px; font-size:13px; cursor:pointer; font-family:var(--font-body);
    color:var(--text-primary);
  }
  .icon-btn:hover{background:var(--accent-light); border-color:var(--accent-border); color:var(--accent);}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px; margin-bottom:16px;
  }
  .search-row{display:flex; gap:10px;}
  .search-row input{
    flex:1; padding:12px 14px; border:1.5px solid var(--border); border-radius:9px;
    font-size:15px; font-family:var(--font-body); direction:ltr; text-align:right;
  }
  .search-row input:focus{outline:none; border-color:var(--accent); background:var(--accent-light);}
  .btn{
    padding:12px 20px; border-radius:9px; border:none; background:var(--accent);
    color:#fff; font-size:14px; font-weight:600; cursor:pointer; font-family:var(--font-body);
    white-space:nowrap;
  }
  .btn:hover{background:#1d4ed8;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-outline{background:var(--surface); color:var(--accent); border:1.5px solid var(--accent-border);}
  .btn-outline:hover{background:var(--accent-light);}
  .btn-green{background:var(--green);}
  .btn-green:hover{background:#15803d;}

  #settingsPanel{display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--border);}
  #settingsPanel.open{display:block;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:12.5px; color:var(--text-secondary); margin-bottom:5px; font-weight:600;}
  .field input{
    width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:8px;
    font-size:13px; font-family:var(--font-mono); direction:ltr;
  }
  .field input:focus{outline:none; border-color:var(--accent);}

  .status-msg{padding:12px 14px; border-radius:9px; font-size:13.5px; margin-bottom:14px; font-weight:600;}
  .status-msg.error{background:#fef2f2; color:var(--red); border:1px solid #fecaca;}
  .status-msg.warn{background:#fffbeb; color:var(--amber); border:1px solid #fde68a;}
  .status-msg.info{background:var(--accent-light); color:var(--accent); border:1px solid var(--accent-border);}

  .order-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  .order-head .name{font-size:17px; font-weight:700;}
  .order-head .badges{display:flex; gap:6px; flex-wrap:wrap;}
  .badge{font-size:11.5px; padding:4px 10px; border-radius:20px; font-weight:600; background:var(--accent-light); color:var(--accent);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th, td{padding:10px 8px; text-align:right; border-bottom:1px solid var(--border);}
  th{color:var(--text-secondary); font-weight:600; font-size:12.5px;}
  td.sku{font-family:var(--font-mono); direction:ltr; text-align:left; font-weight:600;}
  td.barcode-val{font-family:var(--font-mono); direction:ltr; text-align:left;}
  td.barcode-val.missing{color:var(--red); font-size:12px; font-family:var(--font-body);}
  .qty-input{width:60px; padding:6px 8px; border:1.5px solid var(--border); border-radius:6px; font-family:var(--font-mono); text-align:center;}
  .thumb{width:38px; height:38px; border-radius:6px; object-fit:cover; border:1px solid var(--border); background:#f9fafb;}

  .empty-hint{text-align:center; color:var(--text-secondary); padding:30px 10px; font-size:14px;}
  .footer-actions{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:16px;}
  .footer-actions .note{font-size:12px; color:var(--text-secondary);}

  /* ══════════════════════════════════════════════════════
     منطقة الطباعة — الليبل الفعلي (2in × 1in، مطابق لتطبيق Retail Force
     Barcode المستخدم حاليًا: SKU نص فوق (خط سيريف بولد) + باركود تحته
     بيشفّر رقم الـ Barcode الفعلي — بدون أي نص تحت الباركود).
     ══════════════════════════════════════════════════════ */
  #printArea{display:none;}
  .print-label{
    width:2in; height:1in; box-sizing:border-box; padding:0.1in;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:0.06in; overflow:hidden; background:#fff;
  }
  .print-label .lbl-sku-text{
    font-family:var(--font-label); font-weight:700; color:#000;
    white-space:nowrap; line-height:1; text-align:center;
    font-size:22px; /* بيتظبط ديناميكيًا بالجافاسكريبت عشان يتظبط في سطر واحد */
  }
  .print-label svg{ display:block; max-width:100%; }

  @media screen{
    /* معاينة على الشاشة بس — مش جزء من الطباعة نفسها */
    #printPreviewWrap{margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);}
    #printPreviewWrap .preview-title{font-size:12px; color:var(--text-secondary); margin-bottom:8px; font-weight:600;}
    #printPreviewWrap .preview-grid{display:flex; flex-wrap:wrap; gap:10px;}
    #printPreviewWrap .print-label{border:1px dashed #cbd5e1; border-radius:4px;}
  }

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block !important; position:absolute; top:0; right:0; left:0;
    }
    @page{ size:2in 1in; margin:0; }
    .print-label{ page-break-after:always; }
    .print-label:last-child{ page-break-after:auto; }
  }
</style>
</head>
<body>

<div class="container" id="appRoot">

  <header>
    <div class="title">
      🏷️ طباعة باركود SKU للأوردر
      <span class="sub">نسخة تجريبية سريعة — v0.2 (مطابقة لتيمبلت Retail Force)</span>
    </div>
    <button class="icon-btn" onclick="toggleSettings()">⚙️ الإعدادات</button>
  </header>

  <div class="card">
    <div class="search-row">
      <input type="text" id="orderInput" placeholder="رقم الأوردر (بالهاش أو من غيره) — مثال: 1780" autofocus>
      <button class="btn" id="searchBtn" onclick="searchOrder()">🔍 بحث</button>
    </div>

    <div id="settingsPanel">
      <div class="field">
        <label>رابط الـ Worker (Worker URL)</label>
        <input type="text" id="workerUrl" placeholder="https://order-sku-barcode-printer-worker.ecommoda-dev.workers.dev">
      </div>
      <div class="field">
        <label>سر الـ Worker (Worker Secret)</label>
        <input type="text" id="workerSecret">
      </div>
      <button class="btn btn-outline" onclick="saveSettings()">💾 حفظ الإعدادات</button>
    </div>
  </div>

  <div id="statusBox"></div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="order-head">
      <div class="name" id="orderNameOut"></div>
      <div class="badges" id="orderBadges"></div>
    </div>
    <table>
      <thead>
        <tr><th></th><th>المنتج</th><th>SKU</th><th>Barcode</th><th>الكمية</th><th>عدد الطباعة</th></tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <div class="footer-actions">
      <span class="note" id="printNote"></span>
      <button class="btn btn-green" onclick="printBarcodes()">🖨️ طباعة الباركود</button>
    </div>

    <div id="printPreviewWrap" style="display:none;">
      <div class="preview-title">معاينة الليبل قبل الطباعة (مقاس 2×1 إنش):</div>
      <div class="preview-grid" id="previewGrid"></div>
    </div>
  </div>

  <div class="empty-hint" id="emptyHint">
    ادخل رقم الأوردر واضغط بحث عشان تشوف المنتجات وتطبع الباركود.
  </div>

</div>

<!-- منطقة الطباعة الفعلية — مخفية على الشاشة، بتظهر بس وقت الطباعة -->
<div id="printArea"></div>

<script>
// ══════════════════════════════════════════════════════
// §CONFIG
// ══════════════════════════════════════════════════════
const LS_URL    = 'order_sku_barcode_printer_worker_url';
const LS_SECRET = 'order_sku_barcode_printer_worker_secret';

function getConfig() {
  return {
    url: (localStorage.getItem(LS_URL) || '').trim(),
    secret: (localStorage.getItem(LS_SECRET) || '').trim(),
  };
}

function isConfigured() {
  const c = getConfig();
  return !!(c.url && c.secret);
}

async function apiGet(action, params = {}) {
  const cfg = getConfig();
  if (!cfg.url || !cfg.secret) {
    toggleSettings(true);
    throw new Error('الإعدادات غير مكتملة — حط رابط الـ Worker والسر الأول.');
  }
  const qs = new URLSearchParams({ action, ...params }).toString();
  const base = cfg.url.replace(/\/$/, '');
  let resp;
  try {
    resp = await fetch(`${base}/?${qs}`, {
      headers: { Authorization: `Bearer ${cfg.secret}` },
    });
  } catch (e) {
    throw new Error('تعذّر الاتصال بالـ Worker — راجع الرابط أو الشبكة.');
  }
  let data;
  try { data = await resp.json(); }
  catch { throw new Error(`رد غير متوقع من الـ Worker (status ${resp.status})`); }
  if (!resp.ok) throw new Error(data?.error || `فشل الطلب (status ${resp.status})`);
  return data;
}

// ══════════════════════════════════════════════════════
// §SETTINGS-JS
// ══════════════════════════════════════════════════════
function toggleSettings(forceOpen) {
  const el = document.getElementById('settingsPanel');
  if (forceOpen) { el.classList.add('open'); return; }
  el.classList.toggle('open');
}
function loadSettingsIntoInputs() {
  const cfg = getConfig();
  document.getElementById('workerUrl').value = cfg.url;
  document.getElementById('workerSecret').value = cfg.secret;
}
function saveSettings() {
  const url = document.getElementById('workerUrl').value.trim();
  const secret = document.getElementById('workerSecret').value.trim();
  localStorage.setItem(LS_URL, url);
  localStorage.setItem(LS_SECRET, secret);
  showStatus('تم حفظ الإعدادات ✓', 'info');
  toggleSettings(false);
}

// ══════════════════════════════════════════════════════
// §STATUS-JS
// ══════════════════════════════════════════════════════
function showStatus(msg, type) {
  const box = document.getElementById('statusBox');
  box.innerHTML = `<div class="status-msg ${type}">${msg}</div>`;
}
function clearStatus() {
  document.getElementById('statusBox').innerHTML = '';
}

// ══════════════════════════════════════════════════════
// §ORDER-JS
// ══════════════════════════════════════════════════════
let currentItems = [];

async function searchOrder() {
  const raw = document.getElementById('orderInput').value.trim();
  if (!raw) { showStatus('اكتب رقم الأوردر الأول', 'warn'); return; }

  const btn = document.getElementById('searchBtn');
  btn.disabled = true; btn.textContent = '... جارٍ البحث';
  clearStatus();
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('emptyHint').style.display = 'none';

  try {
    const data = await apiGet('get_order', { order: raw });
    renderOrder(data);
  } catch (e) {
    showStatus(e.message, 'error');
    document.getElementById('emptyHint').style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '🔍 بحث';
  }
}

function renderOrder(data) {
  currentItems = data.items || [];
  document.getElementById('orderNameOut').textContent = data.orderName;

  const badges = [];
  if (data.financialStatus) badges.push(`<span class="badge">${data.financialStatus}</span>`);
  if (data.fulfillmentStatus) badges.push(`<span class="badge">${data.fulfillmentStatus}</span>`);
  document.getElementById('orderBadges').innerHTML = badges.join('');

  const tbody = document.getElementById('itemsBody');
  const missingCount = currentItems.filter(it => !it.barcode).length;

  if (!currentItems.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-secondary);padding:20px;">مفيش منتجات فعّالة في الأوردر ده</td></tr>`;
  } else {
    tbody.innerHTML = currentItems.map((it, i) => `
      <tr>
        <td>${it.image ? `<img class="thumb" src="${it.image}">` : ''}</td>
        <td>${escapeHtml(it.title)}${it.variantTitle ? `<div style="font-size:11px;color:var(--text-secondary);">${escapeHtml(it.variantTitle)}</div>` : ''}</td>
        <td class="sku">${it.sku ? escapeHtml(it.sku) : '—'}</td>
        <td class="barcode-val ${it.barcode ? '' : 'missing'}">${it.barcode ? escapeHtml(it.barcode) : '⚠️ لا يوجد Barcode'}</td>
        <td>${it.quantity}</td>
        <td><input type="number" class="qty-input" min="0" value="${it.barcode ? it.quantity : 0}" id="printQty${i}" ${it.barcode ? '' : 'disabled'}></td>
      </tr>
    `).join('');
  }

  document.getElementById('printNote').textContent = missingCount
    ? `⚠️ ${missingCount} صنف من غير رقم Barcode مسجّل — مش هيتطبع لحد ما يتسجّل على شوبيفاي`
    : '';
  document.getElementById('previewGrid').innerHTML = '';
  document.getElementById('printPreviewWrap').style.display = 'none';

  document.getElementById('resultCard').style.display = 'block';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ══════════════════════════════════════════════════════
// §LABEL-JS — بناء الليبل: SKU نص فوق + باركود (رقم الـ Barcode) تحته
// مطابق تمامًا لتيمبلت "Retail Force Barcode" الحالي (2in × 1in، بدون نص
// تحت الباركود، خط سيريف بولد للنص).
// ══════════════════════════════════════════════════════

// بيقلل حجم الخط تدريجيًا لحد ما نص الـ SKU يتظبط في سطر واحد داخل الليبل —
// نفس فكرة "auto-fit" اللي التطبيق الحالي بيعملها لأطوال SKU المختلفة.
//
// ⚠️ ليه Canvas measureText مش el.scrollWidth: #printArea فيه display:none
// طول الوقت لحد ما الطباعة الفعلية تبدأ (@media print بس) — يعني أي قياس
// بيعتمد على layout (scrollWidth/offsetWidth) بيرجّع صفر دايمًا هنا، والحلقة
// كانت بتوهم إنها "شغالة" لكن فعليًا بتوقف فورًا من غير أي تصغير حقيقي.
// Canvas measureText بيحسب عرض النص من الخط نفسه من غير ما يحتاج العنصر
// يبقى مرسوم على الشاشة أصلاً — تم التأكد بالاختبار (Playwright).
const _measureCanvas = document.createElement('canvas');
const _measureCtx = _measureCanvas.getContext('2d');
function textWidthAtSize(text, sizePx, fontFamily) {
  _measureCtx.font = `700 ${sizePx}px ${fontFamily}`;
  return _measureCtx.measureText(text).width;
}
function fitLabelText(el, text, maxWidthPx) {
  const fontFamily = getComputedStyle(document.documentElement).getPropertyValue('--font-label').trim() || 'Georgia, serif';
  let size = 22;
  while (size > 8 && textWidthAtSize(text, size, fontFamily) > maxWidthPx) size -= 1;
  el.style.fontSize = size + 'px';
}

// بيبني عنصر ليبل واحد (SKU + باركود) ويرجّعه — نفس المنطق بيُستخدم في
// الطباعة الفعلية وفي المعاينة على الشاشة، عشان الاتنين يفضلوا متطابقين.
function buildLabelEl(item) {
  const wrap = document.createElement('div');
  wrap.className = 'print-label';

  const textEl = document.createElement('div');
  textEl.className = 'lbl-sku-text';
  textEl.textContent = item.sku || item.barcode;
  wrap.appendChild(textEl);

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  wrap.appendChild(svg);

  // بارکود CODE128 — بيشفّر رقم الـ Barcode الفعلي، مش الـ SKU.
  // JsBarcode مكتبة متزامنة (sync) — بتترسم فورًا من غير أي setTimeout.
  try {
    JsBarcode(svg, item.barcode, {
      format: 'CODE128',
      width: 1.7,
      height: 34,
      margin: 0,
      displayValue: false, // زي الإعداد الحالي: "Content below barcode: None"
    });
  } catch (e) {
    // SKU/Barcode فيه حروف مش مدعومة — نادر جدًا مع أرقام، بس بنمسك الاستثناء
    // عشان لبيل واحد ما يوقفش باقي الطباعة.
    svg.outerHTML = `<div style="color:red;font-size:10px;">تعذّر رسم الباركود</div>`;
  }

  return wrap;
}

function labelsToPrint() {
  const labels = [];
  currentItems.forEach((it, i) => {
    if (!it.barcode) return;
    const qtyEl = document.getElementById(`printQty${i}`);
    const copies = Math.max(0, parseInt(qtyEl.value, 10) || 0);
    for (let c = 0; c < copies; c++) labels.push(it);
  });
  return labels;
}

// ══════════════════════════════════════════════════════
// §PRINT-JS
// ══════════════════════════════════════════════════════
function printBarcodes() {
  if (typeof JsBarcode === 'undefined') {
    showStatus('مكتبة الباركود (JsBarcode) ما اتحمّلتش — تأكد من اتصال الإنترنت وأعد تحميل الصفحة.', 'error');
    return;
  }

  const labels = labelsToPrint();
  if (!labels.length) {
    showStatus('مفيش أي منتج بـ Barcode وعدد طباعة أكبر من صفر', 'warn');
    return;
  }

  const printArea = document.getElementById('printArea');
  printArea.innerHTML = '';
  const els = [];
  labels.forEach(item => {
    const el = buildLabelEl(item);
    printArea.appendChild(el);
    els.push(el);
  });

  // معاينة على الشاشة (نفس عناصر الطباعة بالظبط — مش نسخة منفصلة)
  const previewGrid = document.getElementById('previewGrid');
  previewGrid.innerHTML = '';
  document.getElementById('printPreviewWrap').style.display = 'block';

  // ضبط حجم خط الـ SKU لكل ليبل عشان يتظبط في سطر واحد (1.8in = عرض المحتوى)
  const maxWidthPx = 1.8 * 96; // 96 CSS px تساوي 1 إنش تقريبًا
  els.forEach(el => {
    const textEl = el.querySelector('.lbl-sku-text');
    fitLabelText(textEl, textEl.textContent, maxWidthPx);
    previewGrid.appendChild(el.cloneNode(true));
  });

  clearStatus();

  // مهم: مستنيين رسم فعلي (paint) قبل ما نفتح نافذة الطباعة، عشان الباركود
  // (SVG اتضاف ديناميكيًا) يبان فعلاً في الطباعة — استخدمنا double
  // requestAnimationFrame بدل setTimeout الثابت، وده بيضمن إن المتصفح خلص
  // layout + paint فعلاً قبل window.print().
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      window.print();
    });
  });
}

// ══════════════════════════════════════════════════════
// §INIT
// ══════════════════════════════════════════════════════
document.getElementById('orderInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchOrder();
});

loadSettingsIntoInputs();
if (!isConfigured()) {
  toggleSettings(true);
  showStatus('حط رابط الـ Worker والسر في الإعدادات الأول ⚙️', 'warn');
}
if (typeof JsBarcode === 'undefined') {
  showStatus('تنبيه: مكتبة الباركود ما اتحمّلتش لسه (JsBarcode) — لو المشكلة استمرت حاول تعيد تحميل الصفحة.', 'warn');
}
</script>

</body>
</html>
