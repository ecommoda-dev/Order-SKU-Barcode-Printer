<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة باركود SKU للأوردر</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
<style>
  :root{
    --accent:#2563eb; --accent-light:#eff6ff; --accent-border:#bfdbfe;
    --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --text-primary:#111827; --text-secondary:#6b7280;
    --border:#e5e7eb; --surface:#ffffff; --bg:#f3f4f6;
    --font-body: 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif;
    --font-mono: 'Consolas', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--font-body); background:var(--bg);
    color:var(--text-primary); direction:rtl;
  }
  .container{max-width:900px; margin:0 auto; padding:20px;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:16px 20px; margin-bottom:16px;
  }
  header .title{font-size:18px; font-weight:700; display:flex; align-items:center; gap:10px;}
  header .title .sub{font-size:12px; font-weight:400; color:var(--text-secondary);}
  .icon-btn{
    border:1px solid var(--border); background:var(--surface); border-radius:8px;
    padding:8px 12px; font-size:13px; cursor:pointer; font-family:var(--font-body);
    color:var(--text-primary);
  }
  .icon-btn:hover{background:var(--accent-light); border-color:var(--accent-border); color:var(--accent);}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px; margin-bottom:16px;
  }
  .search-row{display:flex; gap:10px;}
  .search-row input{
    flex:1; padding:12px 14px; border:1.5px solid var(--border); border-radius:9px;
    font-size:15px; font-family:var(--font-body); direction:ltr; text-align:right;
  }
  .search-row input:focus{outline:none; border-color:var(--accent); background:var(--accent-light);}
  .btn{
    padding:12px 20px; border-radius:9px; border:none; background:var(--accent);
    color:#fff; font-size:14px; font-weight:600; cursor:pointer; font-family:var(--font-body);
    white-space:nowrap;
  }
  .btn:hover{background:#1d4ed8;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-outline{background:var(--surface); color:var(--accent); border:1.5px solid var(--accent-border);}
  .btn-outline:hover{background:var(--accent-light);}
  .btn-green{background:var(--green);}
  .btn-green:hover{background:#15803d;}

  #settingsPanel{display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--border);}
  #settingsPanel.open{display:block;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:12.5px; color:var(--text-secondary); margin-bottom:5px; font-weight:600;}
  .field input{
    width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:8px;
    font-size:13px; font-family:var(--font-mono); direction:ltr;
  }
  .field input:focus{outline:none; border-color:var(--accent);}

  .status-msg{padding:12px 14px; border-radius:9px; font-size:13.5px; margin-bottom:14px; font-weight:600;}
  .status-msg.error{background:#fef2f2; color:var(--red); border:1px solid #fecaca;}
  .status-msg.warn{background:#fffbeb; color:var(--amber); border:1px solid #fde68a;}
  .status-msg.info{background:var(--accent-light); color:var(--accent); border:1px solid var(--accent-border);}

  .order-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  .order-head .name{font-size:17px; font-weight:700;}
  .order-head .badges{display:flex; gap:6px; flex-wrap:wrap;}
  .badge{font-size:11.5px; padding:4px 10px; border-radius:20px; font-weight:600; background:var(--accent-light); color:var(--accent);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th, td{padding:10px 8px; text-align:right; border-bottom:1px solid var(--border);}
  th{color:var(--text-secondary); font-weight:600; font-size:12.5px;}
  td.sku{font-family:var(--font-mono); direction:ltr; text-align:left; font-weight:600;}
  td.no-sku{color:var(--red); font-size:12px;}
  .qty-input{width:60px; padding:6px 8px; border:1.5px solid var(--border); border-radius:6px; font-family:var(--font-mono); text-align:center;}
  .thumb{width:38px; height:38px; border-radius:6px; object-fit:cover; border:1px solid var(--border); background:#f9fafb;}

  #printArea{display:none;}
  .barcode-label{
    display:inline-block; border:1px dashed #cbd5e1; border-radius:8px; padding:10px 14px;
    margin:6px; text-align:center; background:#fff;
  }
  .barcode-label .lbl-title{font-size:11px; font-weight:600; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:2px;}
  .barcode-label .lbl-sku{font-size:10px; color:var(--text-secondary); font-family:var(--font-mono);}

  .empty-hint{text-align:center; color:var(--text-secondary); padding:30px 10px; font-size:14px;}
  .footer-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:16px;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block !important; position:absolute; top:0; right:0; left:0;}
  }
</style>
</head>
<body>

<div class="container" id="appRoot">

  <header>
    <div class="title">
      🏷️ طباعة باركود SKU للأوردر
      <span class="sub">نسخة تجريبية سريعة — v0.1</span>
    </div>
    <button class="icon-btn" onclick="toggleSettings()">⚙️ الإعدادات</button>
  </header>

  <div class="card">
    <div class="search-row">
      <input type="text" id="orderInput" placeholder="رقم الأوردر (بالهاش أو من غيره) — مثال: 1780" autofocus>
      <button class="btn" id="searchBtn" onclick="searchOrder()">🔍 بحث</button>
    </div>

    <div id="settingsPanel">
      <div class="field">
        <label>رابط الـ Worker (Worker URL)</label>
        <input type="text" id="workerUrl" placeholder="https://order-sku-barcode-printer-worker.ecommoda-dev.workers.dev">
      </div>
      <div class="field">
        <label>سر الـ Worker (Worker Secret)</label>
        <input type="text" id="workerSecret">
      </div>
      <button class="btn btn-outline" onclick="saveSettings()">💾 حفظ الإعدادات</button>
    </div>
  </div>

  <div id="statusBox"></div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="order-head">
      <div class="name" id="orderNameOut"></div>
      <div class="badges" id="orderBadges"></div>
    </div>
    <table>
      <thead>
        <tr><th></th><th>المنتج</th><th>SKU</th><th>الكمية</th><th>عدد الطباعة</th></tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <div class="footer-actions">
      <button class="btn btn-green" onclick="printBarcodes()">🖨️ طباعة الباركود</button>
    </div>
  </div>

  <div class="empty-hint" id="emptyHint">
    ادخل رقم الأوردر واضغط بحث عشان تشوف المنتجات وتطبع الباركود.
  </div>

</div>

<!-- منطقة الطباعة — مخفية على الشاشة، بتظهر بس وقت الطباعة -->
<div id="printArea"></div>

<script>
// ══════════════════════════════════════════════════════
// §CONFIG
// ══════════════════════════════════════════════════════
const LS_URL    = 'order_sku_barcode_printer_worker_url';
const LS_SECRET = 'order_sku_barcode_printer_worker_secret';

function getConfig() {
  return {
    url: (localStorage.getItem(LS_URL) || '').trim(),
    secret: (localStorage.getItem(LS_SECRET) || '').trim(),
  };
}

function isConfigured() {
  const c = getConfig();
  return !!(c.url && c.secret);
}

async function apiGet(action, params = {}) {
  const cfg = getConfig();
  if (!cfg.url || !cfg.secret) {
    toggleSettings(true);
    throw new Error('الإعدادات غير مكتملة — حط رابط الـ Worker والسر الأول.');
  }
  const qs = new URLSearchParams({ action, ...params }).toString();
  const base = cfg.url.replace(/\/$/, '');
  let resp;
  try {
    resp = await fetch(`${base}/?${qs}`, {
      headers: { Authorization: `Bearer ${cfg.secret}` },
    });
  } catch (e) {
    throw new Error('تعذّر الاتصال بالـ Worker — راجع الرابط أو الشبكة.');
  }
  let data;
  try { data = await resp.json(); }
  catch { throw new Error(`رد غير متوقع من الـ Worker (status ${resp.status})`); }
  if (!resp.ok) throw new Error(data?.error || `فشل الطلب (status ${resp.status})`);
  return data;
}

// ══════════════════════════════════════════════════════
// §SETTINGS-JS
// ══════════════════════════════════════════════════════
function toggleSettings(forceOpen) {
  const el = document.getElementById('settingsPanel');
  if (forceOpen) { el.classList.add('open'); return; }
  el.classList.toggle('open');
}
function loadSettingsIntoInputs() {
  const cfg = getConfig();
  document.getElementById('workerUrl').value = cfg.url;
  document.getElementById('workerSecret').value = cfg.secret;
}
function saveSettings() {
  const url = document.getElementById('workerUrl').value.trim();
  const secret = document.getElementById('workerSecret').value.trim();
  localStorage.setItem(LS_URL, url);
  localStorage.setItem(LS_SECRET, secret);
  showStatus('تم حفظ الإعدادات ✓', 'info');
  toggleSettings(false);
}

// ══════════════════════════════════════════════════════
// §STATUS-JS
// ══════════════════════════════════════════════════════
function showStatus(msg, type) {
  const box = document.getElementById('statusBox');
  box.innerHTML = `<div class="status-msg ${type}">${msg}</div>`;
}
function clearStatus() {
  document.getElementById('statusBox').innerHTML = '';
}

// ══════════════════════════════════════════════════════
// §ORDER-JS
// ══════════════════════════════════════════════════════
let currentItems = [];

async function searchOrder() {
  const raw = document.getElementById('orderInput').value.trim();
  if (!raw) { showStatus('اكتب رقم الأوردر الأول', 'warn'); return; }

  const btn = document.getElementById('searchBtn');
  btn.disabled = true; btn.textContent = '... جارٍ البحث';
  clearStatus();
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('emptyHint').style.display = 'none';

  try {
    const data = await apiGet('get_order', { order: raw });
    renderOrder(data);
  } catch (e) {
    showStatus(e.message, 'error');
    document.getElementById('emptyHint').style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '🔍 بحث';
  }
}

function renderOrder(data) {
  currentItems = data.items || [];
  document.getElementById('orderNameOut').textContent = data.orderName;

  const badges = [];
  if (data.financialStatus) badges.push(`<span class="badge">${data.financialStatus}</span>`);
  if (data.fulfillmentStatus) badges.push(`<span class="badge">${data.fulfillmentStatus}</span>`);
  document.getElementById('orderBadges').innerHTML = badges.join('');

  const tbody = document.getElementById('itemsBody');
  if (!currentItems.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--text-secondary);padding:20px;">مفيش منتجات فعّالة في الأوردر ده</td></tr>`;
  } else {
    tbody.innerHTML = currentItems.map((it, i) => `
      <tr>
        <td>${it.image ? `<img class="thumb" src="${it.image}">` : ''}</td>
        <td>${escapeHtml(it.title)}${it.variantTitle ? `<div style="font-size:11px;color:var(--text-secondary);">${escapeHtml(it.variantTitle)}</div>` : ''}</td>
        <td class="${it.sku ? 'sku' : 'no-sku'}">${it.sku ? escapeHtml(it.sku) : 'لا يوجد SKU'}</td>
        <td>${it.quantity}</td>
        <td><input type="number" class="qty-input" min="0" value="${it.sku ? it.quantity : 0}" id="printQty${i}" ${it.sku ? '' : 'disabled'}></td>
      </tr>
    `).join('');
  }

  document.getElementById('resultCard').style.display = 'block';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ══════════════════════════════════════════════════════
// §PRINT-JS
// ══════════════════════════════════════════════════════
function printBarcodes() {
  const printArea = document.getElementById('printArea');
  printArea.innerHTML = '';

  let labelCount = 0;
  currentItems.forEach((it, i) => {
    if (!it.sku) return;
    const qtyEl = document.getElementById(`printQty${i}`);
    const copies = Math.max(0, parseInt(qtyEl.value, 10) || 0);
    for (let c = 0; c < copies; c++) {
      const wrap = document.createElement('div');
      wrap.className = 'barcode-label';
      const svgId = `bc-${i}-${c}`;
      wrap.innerHTML = `
        <div class="lbl-title">${escapeHtml(it.title)}</div>
        <svg id="${svgId}"></svg>
        <div class="lbl-sku">${escapeHtml(it.sku)}</div>
      `;
      printArea.appendChild(wrap);
      labelCount++;
      // بيتنفذ بعد ما الـ SVG يبقى موجود في الـ DOM
      setTimeout(() => {
        try {
          JsBarcode(`#${svgId}`, it.sku, { format: 'CODE128', width: 1.6, height: 40, fontSize: 11, margin: 4 });
        } catch (e) { /* SKU فيه حروف مش مدعومة في CODE128 — نادر */ }
      }, 0);
    }
  });

  if (labelCount === 0) {
    showStatus('مفيش أي منتج بـ SKU وعدد طباعة أكبر من صفر', 'warn');
    return;
  }

  setTimeout(() => window.print(), 150);
}

// ══════════════════════════════════════════════════════
// §INIT
// ══════════════════════════════════════════════════════
document.getElementById('orderInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchOrder();
});

loadSettingsIntoInputs();
if (!isConfigured()) {
  toggleSettings(true);
  showStatus('حط رابط الـ Worker والسر في الإعدادات الأول ⚙️', 'warn');
}
</script>

</body>
</html>
